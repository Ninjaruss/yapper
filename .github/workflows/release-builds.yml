name: release-builds

# Cross-platform installers can't be produced by cross-compiling from one OS —
# llama.cpp, onnxruntime (sherpa), and the WebView are all native and must be
# built on the target OS. So each platform builds on its own runner and the
# artifacts are attached to the matching GitHub Release.
#
# Trigger manually (workflow_dispatch, choose the tag to attach to) or by
# pushing a v* tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the builds to (must already exist, e.g. v0.1.0)"
        required: true
        default: "v0.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows → NSIS .exe + .msi. The DLL-bundling steps below pack
          # sherpa's onnxruntime.dll / sherpa-onnx-c-api.dll next to the exe
          # (without them the app crashes at launch with a missing DLL).
          - platform: windows-latest
            args: ""
          # Linux is DONE and shipped (self-contained AppImage). Temporarily
          # out of the matrix while iterating on the Windows DLL fix; restore
          # for the next release:
          #   - platform: ubuntu-22.04
          #     args: "--bundles appimage,deb"
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Native build deps for the Linux bundle: WebKitGTK (the webview),
      # ALSA headers (cpal audio capture), plus the usual Tauri toolchain.
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libgtk-3-dev \
            libfuse2 \
            patchelf \
            build-essential curl wget file libssl-dev libxdo-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # No Rust cache on purpose: sherpa/llama download prebuilt native libs
      # into out-of-tree dirs the cache doesn't capture, so a warm cache
      # restores a target/ that then fails to link ("cannot open cargs.lib").
      # These are infrequent release builds — a clean compile is worth it.

      - name: Install frontend dependencies
        run: npm ci

      # sherpa-onnx ships a shared lib (libsherpa-onnx-c-api.so + libonnxruntime.so)
      # in sherpa-rs's build dir, not a standard library path. The binary links it
      # via rpath so it runs, but linuxdeploy resolves deps with ldd and can't find
      # it ("Could not find dependency: libsherpa-onnx-c-api.so"). So: compile first
      # (which downloads the .so), then put its directory on LD_LIBRARY_PATH so the
      # bundle step's linuxdeploy can locate and pack it into the AppImage.
      - name: Pre-compile to fetch sherpa/onnxruntime shared libs (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run tauri build -- --no-bundle

      - name: Expose sherpa shared lib to linuxdeploy (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          SO_DIR=$(find "$GITHUB_WORKSPACE/src-tauri/target" "$HOME/.cache" "$HOME/.local" \
            -name 'libsherpa-onnx-c-api.so' -printf '%h\n' 2>/dev/null | head -1)
          echo "sherpa shared-lib dir: $SO_DIR"
          test -n "$SO_DIR" || { echo "libsherpa-onnx-c-api.so not found"; exit 1; }
          echo "LD_LIBRARY_PATH=$SO_DIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      # Windows: same class of problem as macOS/Linux. sherpa ships DLLs
      # (onnxruntime.dll, sherpa-onnx-c-api.dll, ...) that Tauri doesn't bundle,
      # so the installed app crashes with a missing DLL. Compile first so the
      # DLLs land in target/release, then generate a Windows-only tauri config
      # that bundles each DLL flat next to the exe (on Windows, Tauri's resource
      # root IS the exe folder, so a flattened resource loads at runtime).
      - name: Pre-compile to fetch sherpa/onnxruntime DLLs (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build -- --no-bundle

      - name: Generate tauri.windows.conf.json bundling the DLLs (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          cd src-tauri
          entries=""
          for dll in target/release/*.dll; do
            [ -e "$dll" ] || continue
            base=$(basename "$dll")
            entries="$entries\"$dll\": \"$base\","
          done
          entries=${entries%,}
          test -n "$entries" || { echo "no DLLs found in target/release"; exit 1; }
          printf '{ "bundle": { "resources": { %s } } }\n' "$entries" > tauri.windows.conf.json
          echo "--- tauri.windows.conf.json ---"; cat tauri.windows.conf.json

      - name: Build and attach to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LD_LIBRARY_PATH (set above on Linux) lets linuxdeploy resolve sherpa's
          # .so. APPIMAGE_EXTRACT_AND_RUN keeps the AppImage tools off FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Yapper ${{ github.event.inputs.tag || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
