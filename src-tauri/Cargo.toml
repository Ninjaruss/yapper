[package]
name = "yapper"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
hound = "3.5"
crossbeam-channel = "0.5"
sherpa-rs = { version = "0.6.8", default-features = false, features = ["download-binaries"] }
rubato = "0.16"
reqwest = { version = "0.12", features = ["blocking"] }
tar = "0.4"
bzip2 = "0.5"
encoding_rs = "0.8"
env_logger = "0.11"
claxon = "0.4"

[dev-dependencies]
tempfile = "3"

# llama-cpp-2 is a real dependency as of Task 5: LlamaEngine
# (src/insight/llama.rs) links it directly, not just the Task 1 spike
# example. Exact-pinned per the Task 1 spike notes — this crate's API moves
# with upstream llama.cpp, so an unpinned range risks silently breaking the
# engine on a future `cargo update`.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.152", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.152" }

[[example]]
name = "insight_spike"
path = "examples/insight_spike.rs"

[[example]]
name = "insight_replay"
path = "examples/insight_replay.rs"

# Keep debug builds small: heavy native deps (llama.cpp, onnxruntime) emit
# gigabytes of full debuginfo we never need. Line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

